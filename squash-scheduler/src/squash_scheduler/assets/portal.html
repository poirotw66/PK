<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=s=>document.querySelector(s),content=$('#content');let view='overview',limit=40;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function divisionKey(value){return value.replace(/[\s組]/g,'').replaceAll('男子','男').replaceAll('女子','女')}
function unique(key){let values=D.matches.map(r=>r[key]);if(key==='division')values=[...D.roster.map(r=>r.division),...values];if(key==='court')values=[...D.court_labels,...values];const known=new Map();for(const value of values){const id=key==='division'?divisionKey(value):value;if(!known.has(id))known.set(id,value)}return [...known.values()].sort((a,b)=>a.localeCompare(b,'zh-Hant',{numeric:true}))}

function openGraph(graph){$('#zoom-title').textContent=graph.title;$('#zoom-image').src=graph.image;$('#zoom-image').alt=graph.title;$('#zoom').showModal()}
$('#event-name').textContent=D.name;document.title=D.name+' · 賽事中心';$('#brand-title').textContent=D.evidence?'中正盃':D.name;$('#mobile-name').textContent=D.evidence?'中正盃 · 2026':D.name;$('#status').textContent=D.evidence?'歷史資料':D.draft?'草案預覽':'核准版本';$('#workspace').textContent=D.evidence?'2026 年賽事':'賽事導覽';
$('#notice').textContent=D.coverage_note||(D.evidence?'資料依原始公布賽程整理。目前僅重建男子 F 組對戰圖；姓名索引依原稿文字顯示，身分與兼報尚待確認。':D.draft?'目前為草案／模擬編排，正式場次請以主辦核准公告為準。':'請以主辦最新核准公告為準。');
for(const key of ['date','division','court'])for(const value of unique(key)){const o=el('option','',value);o.value=value;$('#'+key).append(o)}
function filtered(){const q=$('#query').value.trim().toLocaleLowerCase();return D.matches.filter(r=>(!q||[r.code,r.side_a,r.side_b,r.division].some(v=>v.toLocaleLowerCase().includes(q)))&&['date','division','court'].every(k=>!$('#'+k).value||(k==='division'?divisionKey(r[k])===divisionKey($('#'+k).value):r[k]===$('#'+k).value)))}
function rosterFiltered(rows){const q=$('#query').value.trim().toLocaleLowerCase(),division=$('#division').value,names=new Set(rows.flatMap(r=>[r.side_a,r.side_b]));return D.roster.filter(r=>(!q||[r.name,r.division].some(v=>v.toLocaleLowerCase().includes(q)))&&(!division||divisionKey(r.division)===divisionKey(division))&&(!$('#date').value&&!$('#court').value||names.has(r.name)))}
function graphFiltered(){const division=$('#division').value;return D.graphs.filter(g=>!division||(g.division?divisionKey(g.division)===divisionKey(division):divisionKey(g.title).includes(divisionKey(division))))}
function updateDates(){const container=$('#date-strip');container.replaceChildren();for(const day of unique('date')){const rows=D.matches.filter(r=>r.date===day),b=el('button','date-choice'+($('#date').value===day?' active':'')),label=el('div');label.append(el('div','date-value',dateText(day)));const dow=/^\d{4}-\d{2}-\d{2}$/.test(day)?'星期'+'日一二三四五六'[new Date(day+'T00:00:00Z').getUTCDay()]:'日期待確認';label.append(el('div','date-weekday',dow));const total=el('span','date-total');total.append(el('strong','',rows.length),'場');b.append(label,total);b.setAttribute('aria-pressed',String($('#date').value===day));b.onclick=()=>{$('#date').value=$('#date').value===day?'':day;limit=40;render()};container.append(b)}}
function matchRow(r){const row=el('article','match-row');row.dataset.match=r.code;const group=el('div','match-group',r.division);if(r.stage)group.append(el('small','',r.stage));const players=el('div','match-players');players.append(el('span','side',r.side_a),el('span','vs','對'),el('span','side',r.side_b));const court=el('div','match-court',missing(r.court)?'—':r.court);court.title=r.court;row.append(el('div','match-code',r.code),el('div','match-time',missing(r.time)?'—':r.time),group,players,court);return row}
function table(rows,cap){const box=el('div','schedule-panel');if(!rows.length){box.append(el('p','empty','沒有符合的場次，請更換姓名或清除篩選。'));return box}let used=0;for(const day of [...new Set(rows.map(r=>r.date))]){const dayRows=rows.filter(r=>r.date===day),shown=dayRows.slice(0,Math.max(0,cap-used));if(!shown.length)continue;const heading=el('h3','day-heading',dateText(day));heading.append(el('span','',dayRows.length+' 場'));box.append(heading);const head=el('div','table-head');for(const s of ['場次','時間','組別','對戰選手','球場'])head.append(el('span','',s));box.append(head);for(const r of shown)box.append(matchRow(r));used+=shown.length}if(rows.length>used){const b=el('button','view-all',(view==='overview'?'查看全部 '+rows.length+' 場':'載入更多場次')+'　→');b.onclick=()=>{if(view==='overview')setView('schedule');else{limit+=40;render()}};box.append(b)}return box}
function empty(text){content.append(el('p','empty',text))}
function render(){const rows=filtered();content.replaceChildren();$('#heading').textContent=({overview:'賽程總覽',schedule:'全部賽程',brackets:'分組對戰',players:'姓名索引',rules:'規則與說明'})[view];$('#subtitle').textContent=unique('date').map(dateText).join(' — ')+' · '+D.matches.length+' 場賽程';$('#section-title').textContent=({overview:'場次一覽',schedule:'場次一覽',brackets:'各組對戰圖',players:'依姓名查找場次',rules:'賽事資料與規則'})[view];$('#count').textContent=rows.length+' / '+D.matches.length+' 場';updateDates();
if(view==='overview'||view==='schedule'){const layout=el('div',view==='overview'?'overview-layout':'schedule-layout');layout.append(table(rows,view==='overview'?6:limit));if(view==='overview'){const side=el('aside','overview-aside');if(D.graphs.length){const graph=D.graphs[0],panel=el('section','side-panel');panel.append(el('h3','',graph.title));const image=el('img','preview-image');image.src=graph.image;image.alt=graph.title;const button=el('button','side-action','查看分組對戰　→');image.onclick=()=>openGraph(graph);button.onclick=()=>setView('brackets');panel.append(image,button);side.append(panel)}const info=el('section','side-panel');info.append(el('h3','',D.evidence?'關於這份賽程':'賽事資訊'),el('p','',D.evidence?evidenceSummary():'賽程由本機資料產生，請以主辦最新核准公告為準。'),el('p','',D.evidence?'原稿未記載球場的位置以「—」顯示。':'可依姓名、日期及組別查詢對戰。'));side.append(info);layout.append(side)}content.append(layout);return}
if(view==='brackets'){const grid=el('div','graph-grid'),graphs=graphFiltered();$('#count').textContent=graphs.length+' 張對戰圖';for(const graph of graphs){const card=el('article','graph-card'),head=el('div','graph-head'),b=el('button','','放大查看');b.onclick=()=>openGraph(graph);head.append(el('h3','',graph.title),b);const img=el('img');img.src=graph.image;img.alt=graph.title;card.append(head,img);grid.append(card)}content.append(grid);if(!grid.children.length){const members=D.roster.filter(r=>divisionKey(r.division)===divisionKey($('#division').value));empty(members.length===1?'此組別僅 1 筆報名，原稿未提供對戰圖。':'此組別的對戰圖尚待確認。')}return}
if(view==='players'){const names=new Map(),roster=rosterFiltered(rows);if(D.roster.length){for(const r of roster){if(!names.has(r.name))names.set(r.name,new Set());names.get(r.name).add(r.division)}}else for(const r of rows)for(const name of [r.side_a,r.side_b]){if(/待確認|原稿未載|勝者|敗者|池第|^[①-⑳]|待抽|輪空/.test(name))continue;if(!names.has(name))names.set(name,new Set());names.get(name).add(r.division)}$('#count').textContent=names.size+' 個姓名'+(D.roster.length?' · '+roster.length+' 筆報名':'');const grid=el('div','names');for(const [name,groups] of [...names].sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'))){const b=el('button','person');b.append(el('strong','',name),el('span','',[...groups].join('、')));b.onclick=()=>{$('#query').value=name;setView('schedule')};grid.append(b)}content.append(grid);if(!grid.children.length)empty('目前沒有符合的姓名。');return}
const grid=el('div','rules');for(const rule of D.rules){const card=el('article','rule');card.append(el('h3','',rule.title));for(const line of rule.lines||[])card.append(el('p','',line));grid.append(card)}content.append(grid);if(!D.rules.length)empty('比賽規則尚待主辦確認。')}
function setView(value){view=value;limit=40;document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});setMenu(false);render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#query').oninput=()=>{limit=40;render()};for(const key of ['date','division','court'])$('#'+key).onchange=()=>{limit=40;render()};$('#clear').onclick=()=>{for(const k of ['query','date','division','court'])$('#'+k).value='';limit=40;render()};$('#filter-toggle').onclick=()=>{const open=$('#filter-fields').classList.toggle('open');$('#filter-toggle').setAttribute('aria-expanded',String(open))};$('#menu').onclick=()=>setMenu(!$('#sidebar').classList.contains('open'));$('#overlay').onclick=()=>setMenu(false);$('#close').onclick=()=>$('#zoom').close();document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false);if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#query').focus()}});render();
</script>
</body></html>
